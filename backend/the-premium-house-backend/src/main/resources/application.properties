spring.application.name=the-premium-house-backend

spring.datasource.url=jdbc:mysql://localhost:3306/smartpay?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

server.port=8080

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

app.rate-limit.auth.max-requests=10
app.rate-limit.auth.window-seconds=60

app.rate-limit.public-requests.max-requests=120
app.rate-limit.public-requests.window-seconds=60

app.rate-limit.authenticated.max-requests=180
app.rate-limit.authenticated.window-seconds=60

app.rate-limit.login-max-failures=5
app.rate-limit.login-base-backoff-seconds=2
app.rate-limit.login-max-backoff-seconds=300

logging.level.org.flywaydb=INFO